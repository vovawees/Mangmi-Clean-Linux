# SPDX-License-Identifier: GPL-2.0-or-later
# Mangmi Clean Linux - pinned build inputs.
# Everything the build downloads is pinned here (version + sha256 or git commit),
# so a given commit of this repository always produces the same system.
# Override anything in config/local.conf (git-ignored) or via environment.

DISTRO_NAME="Mangmi Clean Linux"
DISTRO_ID="mangmi"
DISTRO_VERSION="${DISTRO_VERSION:-2026.11}"
DEVICE_NAME="Mangmi Air X"
DEVICE_SOC="sm6115"

# Default device tree. Mangmi Air X ships in three panel/board revisions:
#   mq65  - TD4310 panel                    -> sm6115-mangmi-air-x-mq65.dtb
#   mq66  - Himax HX83112A panel            -> sm6115-mangmi-air-x-mq66.dtb
#   mq66b - BM5460BB1 panel                 -> sm6115-mangmi-air-x-mq66b.dtb
DEFAULT_MODEL="${DEFAULT_MODEL:-mq65}"
DTBS="qcom/sm6115-mangmi-air-x-mq65.dtb qcom/sm6115-mangmi-air-x-mq66.dtb qcom/sm6115-mangmi-air-x-mq66b.dtb"

# --- Linux kernel ------------------------------------------------------------
# Base release + latest stable patch (both verified by sha256).
KERNEL_BASE="7.2"
KERNEL_BASE_SHA256="f9fef3d14c0df53819026f4be74459835c2a0b0dcbf5b5bbd9ea19f0829402b3"
KERNEL_STABLE="7.2.15"
KERNEL_STABLE_SHA256="2d89124e7adfe0e806bd4ae2c67da530ec4e7b45f466ccae77464dbcc878c7ac"
KERNEL_MIRROR="${KERNEL_MIRROR:-https://cdn.kernel.org/pub/linux/kernel/v7.x}"
# Optional sched_ext (BTF) support for scx schedulers (scx_lavd, scx_bpfland).
KERNEL_SCHED_EXT="${KERNEL_SCHED_EXT:-1}"
# ROCKNIX patches that only make sense inside the ROCKNIX toolchain.
KERNEL_PATCH_EXCLUDE="9999-fix-rust-build-error.patch"

# Built-in Wi-Fi regulatory database (cfg80211 is built into the kernel).
REGDB_VERSION="2026.09.03"
REGDB_SHA256="b22e0901227b820cd1c280abe681a15b773a5103a5e10dc442e94ebb34cbf58d"

# --- ROCKNIX (device enablement: patches, device trees, UCM, configs) ---------
ROCKNIX_REPO="https://github.com/ROCKNIX/distribution.git"
ROCKNIX_COMMIT="d550722d77cf5bc835c80243749ba68d68774e89"

# --- Firmware ------------------------------------------------------------------
# Device specific blobs (GPU zap shader, DSP, Wi-Fi board file, amplifier ACF).
EXTRA_FIRMWARE_REPO="https://github.com/ROCKNIX/extra-firmware.git"
EXTRA_FIRMWARE_COMMIT="925dfb5efbe5d6c3ca654f81e3e1f367f8492777"

# --- Boot loader -----------------------------------------------------------------
OPENABL_VERSION="v1.2"
OPENABL_ELF_SHA256="feb3a0c7428397c884eb43aefcbcafbcfd4fd07a567d18963a4dc2f37c0ad961"
OPENABL_ZIP_SHA256="187ecf9eae5fe492e1cf5df3800b4eca564496331d6ec79c0b7a18e1a759cb8e"
OPENABL_URL="https://github.com/OpenHandheldCollective/OpenABL/releases/download/${OPENABL_VERSION}"

# --- Root filesystem ---------------------------------------------------------------
ALARM_MIRROR="${ALARM_MIRROR:-http://ca.us.mirror.archlinuxarm.org}"
ALARM_ROOTFS_URL="${ALARM_ROOTFS_URL:-${ALARM_MIRROR}/os/ArchLinuxARM-aarch64-latest.tar.gz}"

# Image layout (MiB). The root partition is sized to its contents (+ ~12% and
# 640 MiB headroom) unless IMAGE_ROOT_MB asks for more; it grows to fill the
# whole card on first boot anyway.
IMAGE_ESP_MB=512
IMAGE_ROOT_MB="${IMAGE_ROOT_MB:-}"
# Image flavour: full (console + desktop + emulators) or console (no Plasma).
IMAGE_FLAVOUR="${IMAGE_FLAVOUR:-full}"

# Default user (password must be changed on first boot via the setup wizard).
DEFAULT_USER="${DEFAULT_USER:-mangmi}"
DEFAULT_PASSWORD="${DEFAULT_PASSWORD:-mangmi}"
DEFAULT_HOSTNAME="${DEFAULT_HOSTNAME:-mangmi-air-x}"
DEFAULT_LOCALE="${DEFAULT_LOCALE:-ru_RU.UTF-8}"
DEFAULT_TIMEZONE="${DEFAULT_TIMEZONE:-Europe/Moscow}"

# --- Frontend / emulators -------------------------------------------------------------
# Upstream aarch64 builds (ES-DE, DuckStation, melonDS, ARMSX2) are pinned by
# version + sha256 inside their PKGBUILDs under packages/*-bin.
# Libretro cores not packaged by Arch Linux ARM come from the libretro
# buildbot (packages/mangmi-cores, bump pkgver to refresh them).
