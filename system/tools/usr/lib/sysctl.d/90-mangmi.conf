# Mangmi Clean Linux - kernel tuning for a 4/8-core gaming handheld.

# Memory: zram swap is cheap, page clustering is useless for it
vm.swappiness = 100
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 50
# No background compaction stalls while playing (THP uses defer+madvise)
vm.compaction_proactiveness = 0
# Emulators (PS2/Switch-class JITs) map a lot of memory regions
vm.max_map_count = 2147483642
# Write back early and in small chunks: no multi-second stalls on SD cards
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 50331648
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 1500

# Quiet console
kernel.printk = 3 3 3 3
-kernel.nmi_watchdog = 0
kernel.sched_autogroup_enabled = 0

# Network (ROCKNIX defaults + low-latency TCP)
net.core.default_qdisc = fq_codel
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
-net.ipv4.tcp_congestion_control = bbr

fs.inotify.max_user_watches = 524288
