# Transparent huge pages for the large guest-memory mappings of emulators,
# defragmented lazily so nothing stalls in the foreground.
w- /sys/kernel/mm/transparent_hugepage/enabled - - - - always
w- /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w- /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
# MGLRU: keep the running game's working set from being thrashed out
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
d /var/lib/mangmi 0755 root root -
