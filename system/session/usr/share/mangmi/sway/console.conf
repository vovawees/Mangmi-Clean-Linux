# Mangmi Clean Linux - console (game) mode compositor.
# A borderless kiosk: every window is full screen, nothing else is drawn.
include $XDG_RUNTIME_DIR/mangmi/sway-output.conf

output * adaptive_sync off
output * max_render_time off
output * allow_tearing yes

default_border none
default_floating_border none
hide_edge_borders both
focus_follows_mouse no
mouse_warping none
focus_on_window_activation focus
popup_during_fullscreen smart
seat * hide_cursor 1000
seat * hide_cursor when-typing enable

for_window [all] fullscreen enable, inhibit_idle fullscreen, allow_tearing yes

# Volume keys (desktop mode: handled by Plasma)
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# With a USB/Bluetooth keyboard
bindsym Ctrl+Alt+BackSpace exec mangmi-mode desktop
bindsym Ctrl+Alt+t exec foot

exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec /usr/lib/mangmi/console-frontend
