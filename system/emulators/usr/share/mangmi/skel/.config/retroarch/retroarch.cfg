# Mangmi Clean Linux - RetroArch defaults (only what differs from upstream).
# Hotkeys: hold Guide (Mangmi button) and press:
#   Start = quit to ES-DE    North (X/Y top) = menu      R1/L1 = save/load state
#   R2 = fast-forward       South = pause               West = screenshot
#   East = FPS counter
# The menu is trimmed to what a handheld needs (see "menu" below); everything
# hidden comes back under Settings -> User Interface -> Menu Item Visibility.
video_driver = "glcore"
driver_switch_enable = "true"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_max_swapchain_images = "2"
video_threaded = "false"
video_hard_sync = "false"
video_smooth = "false"
video_shader_enable = "false"
video_gpu_screenshot = "true"
video_allow_rotate = "true"
video_font_size = "28.000000"
audio_driver = "pipewire"
audio_latency = "64"
audio_out_rate = "48000"
audio_resampler_quality = "2"
audio_sync = "true"
input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "~/.config/retroarch/autoconfig"
input_max_users = "5"
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "2"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_toggle_fast_forward_btn = "7"
input_pause_toggle_btn = "0"
input_screenshot_btn = "3"
input_fps_toggle_btn = "1"
input_hotkey_block_delay = "5"
input_menu_toggle_gamepad_combo = "0"
quit_press_twice = "false"
# --- menu: Ozone, Nord colours, large text for the 5.5" screen ---------------------
menu_driver = "ozone"
ozone_menu_color_theme = "2"
menu_scale_factor = "1.200000"
menu_widget_scale_auto = "true"
menu_battery_level_enable = "true"
menu_timedate_enable = "true"
menu_show_start_screen = "false"
menu_show_sublabels = "true"
menu_pointer_enable = "true"
menu_navigation_wraparound_enable = "true"
# Xbox layout: the bottom button (A) confirms, the right one (B) goes back, as in ES-DE
menu_swap_ok_cancel_buttons = "true"
menu_show_advanced_settings = "false"
# main menu: no core loading, discs, updaters, information or power items
menu_show_load_core = "false"
menu_show_load_disc = "false"
menu_show_dump_disc = "false"
menu_show_eject_disc = "false"
menu_show_core_updater = "false"
menu_show_online_updater = "false"
menu_show_legacy_thumbnail_updater = "false"
menu_show_information = "false"
menu_show_configurations = "false"
menu_show_help = "false"
menu_show_restart_retroarch = "false"
menu_show_reboot = "false"
menu_show_shutdown = "false"
menu_show_overlays = "false"
menu_show_video_layout = "false"
# sidebar: main menu, settings, favourites, history, playlists
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
content_show_explore = "false"
content_show_add = "false"
content_show_contentless_cores = "0"
# settings: picture, sound, controls, saves, on-screen display, interface, achievements
settings_show_drivers = "false"
settings_show_latency = "false"
settings_show_core = "false"
settings_show_configuration = "false"
settings_show_logging = "false"
settings_show_file_browser = "false"
settings_show_frame_throttle = "false"
settings_show_recording = "false"
settings_show_ai_service = "false"
settings_show_accessibility = "false"
settings_show_power_management = "false"
settings_show_network = "false"
settings_show_playlists = "false"
settings_show_user = "false"
settings_show_directory = "false"
# in-game quick menu (Guide + North): resume, restart, close, states, screenshot,
# core options, controls, shaders
quick_menu_show_undo_save_load_state = "false"
quick_menu_show_add_to_favorites = "false"
quick_menu_show_start_recording = "false"
quick_menu_show_start_streaming = "false"
quick_menu_show_set_core_association = "false"
quick_menu_show_reset_core_association = "false"
quick_menu_show_save_core_overrides = "false"
quick_menu_show_save_game_overrides = "false"
quick_menu_show_save_content_dir_overrides = "false"
quick_menu_show_information = "false"
quick_menu_show_download_thumbnails = "false"
quick_menu_show_replay = "false"
quick_menu_show_cheats = "false"
# "Close content" returns to ES-DE when ES-DE started the game
quit_on_close_content = "2"
libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
system_directory = "~/BIOS"
rgui_browser_directory = "~/ROMs"
screenshot_directory = "~/Pictures"
savestate_thumbnail_enable = "true"
savestate_auto_index = "true"
rewind_enable = "false"
run_ahead_enabled = "false"
pause_nonactive = "false"
fastforward_ratio = "3.000000"
fastforward_frameskip = "true"
# fewer pop-ups: only screenshots, saves and fast-forward
notification_show_autoconfig = "false"
notification_show_remap_load = "false"
notification_show_config_override_load = "false"
notification_show_set_initial_disk = "false"
notification_show_cheats_applied = "false"
notification_show_patch_applied = "false"
notification_show_refresh_rate = "false"
notification_show_netplay_extra = "false"
core_info_cache_enable = "true"
config_save_on_exit = "true"
